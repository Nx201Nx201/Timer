main{position:relative;z-index:1}
.card{background:color-mix(in srgb,var(--sf) 86%,transparent)}
.panel{display:none}.panel.on{display:block}
main::before{content:"";display:block;height:10px;margin-bottom:14px;border-radius:2px;background:repeating-linear-gradient(-45deg,var(--ac) 0 10px,transparent 10px 20px)}
.big{font-size:clamp(48px,17vw,84px);font-weight:300;letter-spacing:-.02em;font-variant-numeric:tabular-nums;text-align:center;margin:12px 0 18px;line-height:1}
.big small{font-size:.4em;color:var(--mut)}
.card{background:var(--sf);border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin-bottom:10px}
button,select,input{font:inherit;color:inherit}
button{border:0;border-radius:999px;padding:12px 22px;background:var(--sf);border:1px solid var(--line);cursor:pointer;min-height:44px}
button.p{background:var(--ac);color:var(--acink);border-color:var(--ac);font-weight:700}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
.row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-bottom:14px}
input,select{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px 12px;min-height:44px}
.t3{display:flex;gap:8px;justify-content:center;margin-bottom:12px}
.t3 label{display:flex;flex-direction:column;align-items:center;font-size:12px;color:var(--mut);gap:4px}
.t3 input{width:84px;text-align:center;font-size:26px;font-weight:300}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin:0 0 18px}
.bar i{display:block;height:100%;width:0;background:var(--ac)}
.item{display:flex;align-items:center;gap:12px}
.item .tm{font-size:34px;font-weight:300;font-variant-numeric:tabular-nums}
.item .grow{flex:1;min-width:0}
.item .grow div{color:var(--mut);font-size:13px;overflow:hidden;text-overflow:ellipsis}
.sw{appearance:none;width:50px;height:30px;border-radius:15px;background:var(--line);position:relative;cursor:pointer;border:0;padding:0;flex:none}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:left .15s}
.sw:checked{background:var(--ok)}.sw:checked::after{left:23px;background:var(--acink)}
.x{background:none;border:0;color:var(--mut);padding:8px;min-height:44px}
.lap{display:flex;justify-content:space-between;padding:8px 4px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
.lap.best{font-weight:700;box-shadow:inset 4px 0 0 var(--ac);padding-left:12px}.lap.worst{color:var(--mut);text-decoration:line-through}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--sf);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;border:0;border-radius:0;background:none;padding:14px 4px;color:var(--mut);font-size:13px}
nav button.on{color:var(--ac);font-weight:700;box-shadow:inset 0 3px 0 var(--ac)}
#ring{position:fixed;inset:0;background:var(--ac);color:var(--acink);display:none;flex-direction:column;align-items:center;justify-content:center;gap:10px;z-index:9;text-align:center;padding:24px}
#ring.on{display:flex;animation:pulse 1s infinite alternate}
#ring h2{font-size:clamp(40px,14vw,72px);font-weight:300;margin:0}
#ring button{background:var(--acink);color:var(--ac);font-weight:700;border:0;min-width:200px}
@keyframes pulse{to{filter:brightness(1.15)}}
@media (prefers-reduced-motion:reduce){#ring.on{animation:none}}
.cap{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:12px;color:var(--mut);font-size:14px}
</style>
</head>
<body>
<main>
<h1><span id="today"></span><button class="x" id="theme" aria-label="Farbschema wechseln">Schwarz/Gelb</button></h1>

<section class="panel" id="p-alarm">
  <div class="big" id="clock"></div>
  <div class="card">
    <div class="row" style="margin:0 0 10px"><input type="time" id="aTime" value="07:00" aria-label="Weckzeit"><input id="aLabel" placeholder="Name (optional)" aria-label="Name des Weckers" style="flex:1;min-width:120px"></div>
    <div class="cap"><label><input type="checkbox" id="aDaily"> Täglich wiederholen</label>
      <span><select id="aSound" aria-label="Klingelton"></select> <button id="test">Ton testen</button></span></div>
    <div class="row" style="margin:0"><button class="p" id="aAdd">Wecker hinzufügen</button></div>
  </div>
  <div id="aList"></div>
</section>

<section class="panel" id="p-timer">
  <div class="big" id="tDisp">00:05:00</div>
  <div class="bar"><i id="tBar"></i></div>
  <div class="t3">
    <label>Std<input type="number" id="th" min="0" max="99" value="0"></label>
    <label>Min<input type="number" id="tm" min="0" max="59" value="5"></label>
    <label>Sek<input type="number" id="ts" min="0" max="59" value="0"></label>
  </div>
  <div class="row"><button data-pre="60">1 Min</button><button data-pre="300">5 Min</button><button data-pre="600">10 Min</button><button data-pre="900">15 Min</button></div>
  <div class="row"><button class="p" id="tGo">Start</button><button id="tReset">Zurücksetzen</button></div>
  <div class="cap"><span>Klingelton</span><select id="tSound" aria-label="Klingelton für Timer"></select></div>
</section>

<section class="panel on" id="p-sw">
  <div class="big" id="swDisp">00:00.00</div>
  <div class="row"><button class="p" id="swGo">Start</button><button id="swLap">Runde</button><button id="swReset">Zurücksetzen</button></div>
  <div id="laps"></div>
</section>

<section class="panel" id="p-world">
  <div class="row"><select id="wSel" aria-label="Stadt wählen"></select><button class="p" id="wAdd">Stadt hinzufügen</button></div>
  <div id="wList"></div>
</section>
</main>

<nav aria-label="Bereiche">
  <button class="on" data-t="sw">Stoppuhr</button><button data-t="alarm">Wecker</button><button data-t="timer">Timer</button><button data-t="world">Weltuhr</button>
</nav>

<div id="ring" role="alertdialog" aria-live="assertive"><div id="rSub"></div><h2 id="rTitle"></h2>
  <button id="rStop">Stopp</button><button id="rSnooze">5 Min schlummern</button></div>

<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const p2=n=>String(n).padStart(2,'0');
/* ---------- Speicher ---------- */
let S={alarms:[],sound:'klassisch',tsound:'melodie',cities:['Europe/Berlin','America/New_York','Asia/Tokyo','Australia/Sydney']};
try{const r=localStorage.getItem('uhr-app');if(r)S=Object.assign(S,JSON.parse(r))}catch(e){}
const save=()=>{try{localStorage.setItem('uhr-app',JSON.stringify(S))}catch(e){}};

/* ---------- Klänge ---------- */
let ctx,ringInt=null;
const au=()=>{if(!ctx)ctx=new(window.AudioContext||window.webkitAudioContext)();if(ctx.state==='suspended')ctx.resume();return ctx};
function tone(f,t,d,type,v){const c=au(),o=c.createOscillator(),g=c.createGain();o.type=type;o.frequency.value=f;
 g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.01);g.gain.exponentialRampToValueAtTime(.001,t+d);
 o.connect(g);g.connect(c.destination);o.start(t);o.stop(t+d+.05)}
const SOUNDS={
 klassisch:{n:'Klassisch (Piepen)',len:1.4,play:t=>{for(let i=0;i<4;i++)tone(1400,t+i*.2,.1,'square',.15)}},
 sirene:{n:'Sirene',len:1.6,play:t=>{const c=au(),o=c.createOscillator(),g=c.createGain();o.type='sawtooth';
  o.frequency.setValueAtTime(500,t);o.frequency.linearRampToValueAtTime(1000,t+.8);o.frequency.linearRampToValueAtTime(500,t+1.6);
  g.gain.value=.15;o.connect(g);g.connect(c.destination);o.start(t);o.stop(t+1.6)}},
 melodie:{n:'Melodie',len:2,play:t=>{[523,659,784,1047,784,659].forEach((f,i)=>tone(f,t+i*.25,.45,'triangle',.25))}},
 glocke:{n:'Glocke',len:2.2,play:t=>{[880,1320,1760].forEach((f,i)=>tone(f,t+i*.02,2,'sine',.2/(i+1)))}}
};
function startSound(k){stopSound();const s=SOUNDS[k]||SOUNDS.klassisch;
 const go=()=>{try{s.play(au().currentTime+.05)}catch(e){}if(navigator.vibrate)navigator.vibrate([300,150,300])};
 go();ringInt=setInterval(go,s.len*1000)}
function stopSound(){clearInterval(ringInt);ringInt=null;if(navigator.vibrate)navigator.vibrate(0)}
['#aSound','#tSound'].forEach(id=>{$(id).innerHTML=Object.entries(SOUNDS).map(([k,v])=>`<option value="${k}">${v.n}</option>`).join('')});
$('#aSound').value=S.sound;$('#tSound').value=S.tsound;
$('#aSound').onchange=e=>{S.sound=e.target.value;save()};
$('#tSound').onchange=e=>{S.tsound=e.target.value;save()};
$('#test').onclick=()=>{au();const s=SOUNDS[$('#aSound').value];s.play(au().currentTime+.05)};

/* ---------- Klingel-Ansicht ---------- */
let snoozeFn=null;
function ring(title,sub,key,snooze){startSound(key);$('#rTitle').textContent=title;$('#rSub').textContent=sub;
 snoozeFn=snooze||null;$('#rSnooze').style.display=snooze?'':'none';$('#ring').classList.add('on');$('#rStop').focus()}
$('#rStop').onclick=()=>{stopSound();$('#ring').classList.remove('on')};
$('#rSnooze').onclick=()=>{stopSound();$('#ring').classList.remove('on');if(snoozeFn)snoozeFn()};

/* ---------- Tabs ---------- */
$$('nav button').forEach(b=>b.onclick=()=>{au();$$('nav button').forEach(x=>x.classList.toggle('on',x===b));
 $$('.panel').forEach(p=>p.classList.toggle('on',p.id==='p-'+b.dataset.t))});
$('#theme').onclick=()=>{const d=document.documentElement,dark=getComputedStyle(d).getPropertyValue('--bg').trim()==='#0a0a0a';d.dataset.theme=dark?'light':'dark'};

/* ---------- Wecker ---------- */
function drawAlarms(){const box=$('#aList');box.innerHTML='';
 if(!S.alarms.length){box.innerHTML='<p style="text-align:center;color:var(--mut)">Noch kein Wecker. Stelle oben eine Zeit ein.</p>';return}
 [...S.alarms].sort((a,b)=>a.time.localeCompare(b.time)).forEach(a=>{
  const d=document.createElement('div');d.className='card item';
  d.innerHTML='<div class="tm"></div><div class="grow"><b></b><div></div></div><input type="checkbox" class="sw" aria-label="Wecker an/aus"><button class="x" aria-label="Wecker löschen">Löschen</button>';
  d.querySelector('.tm').textContent=a.time;d.querySelector('b').textContent=a.label||'Wecker';
  d.querySelector('.grow div').textContent=a.daily?'Täglich':'Einmalig';
  const sw=d.querySelector('.sw');sw.checked=a.on;sw.onchange=()=>{a.on=sw.checked;save()};
  d.querySelector('.x').onclick=()=>{S.alarms=S.alarms.filter(x=>x!==a);save();drawAlarms()};
  box.appendChild(d)})}
$('#aAdd').onclick=()=>{au();const t=$('#aTime').value;if(!t)return;
 S.alarms.push({time:t,label:$('#aLabel').value.trim(),on:true,daily:$('#aDaily').checked,last:''});$('#aLabel').value='';save();drawAlarms()};
function checkAlarms(now){const hm=p2(now.getHours())+':'+p2(now.getMinutes()),key=now.toDateString()+hm;
 S.alarms.forEach(a=>{if(a.on&&a.time===hm&&a.last!==key){a.last=key;if(!a.daily)a.on=false;save();drawAlarms();
  ring(a.time,a.label||'Wecker',S.sound,()=>setTimeout(()=>ring('Schlummern',a.label||'Wecker',S.sound,null),300000));}})}

/* ---------- Timer ---------- */
let T={run:false,end:0,left:null,total:0};
const fmtT=s=>{s=Math.max(0,Math.ceil(s));return p2(Math.floor(s/3600))+':'+p2(Math.floor(s%3600/60))+':'+p2(s%60)};
const inputSecs=()=>(+$('#th').value||0)*3600+(+$('#tm').value||0)*60+(+$('#ts').value||0);
function setInputs(s){$('#th').value=Math.floor(s/3600);$('#tm').value=Math.floor(s%3600/60);$('#ts').value=s%60}
$$('[data-pre]').forEach(b=>b.onclick=()=>{if(T.run)return;T.left=null;setInputs(+b.dataset.pre);$('#tDisp').textContent=fmtT(+b.dataset.pre)});
['#th','#tm','#ts'].forEach(id=>$(id).oninput=()=>{if(!T.run&&T.left===null)$('#tDisp').textContent=fmtT(inputSecs())});
$('#tGo').onclick=()=>{au();
 if(T.run){T.left=(T.end-Date.now())/1000;T.run=false;$('#tGo').textContent='Weiter';return}
 if(T.left===null){T.left=inputSecs();T.total=T.left}
 if(T.left<=0)return;T.end=Date.now()+T.left*1000;T.run=true;$('#tGo').textContent='Pause'};
$('#tReset').onclick=()=>{T={run:false,end:0,left:null,total:0};$('#tGo').textContent='Start';$('#tDisp').textContent=fmtT(inputSecs());$('#tBar').style.width='0'};
function tickTimer(){if(!T.run)return;const r=(T.end-Date.now())/1000;
 $('#tDisp').textContent=fmtT(r);$('#tBar').style.width=(100-100*r/T.total)+'%';
 if(r<=0){const tot=T.total;$('#tReset').click();ring('Zeit abgelaufen',fmtT(tot)+' Timer',S.tsound,null)}
 else document.title=fmtT(r)+' · Timer'}

/* ---------- Stoppuhr ---------- */
let W={run:false,t0:0,acc:0,laps:[]};
const wNow=()=>W.acc+(W.run?performance.now()-W.t0:0);
const fmtW=ms=>{const c=Math.floor(ms/10)%100,s=Math.floor(ms/1000)%60,m=Math.floor(ms/60000)%60,h=Math.floor(ms/3600000);return (h?h+':':'')+p2(m)+':'+p2(s)+'.'+p2(c)};
$('#swGo').onclick=()=>{if(W.run){W.acc=wNow();W.run=false;$('#swDisp').textContent=fmtW(W.acc);$('#swGo').textContent='Weiter'}else{W.t0=performance.now();W.run=true;$('#swGo').textContent='Stopp'}};
$('#swLap').onclick=()=>{if(!W.run)return;W.laps.unshift(wNow());drawLaps()};
$('#swReset').onclick=()=>{W={run:false,t0:0,acc:0,laps:[]};$('#swGo').textContent='Start';$('#swDisp').textContent='00:00.00';drawLaps()};
function drawLaps(){const sps=W.laps.map((v,i)=>v-(W.laps[i+1]||0)),best=Math.min(...sps),worst=Math.max(...sps);$('#laps').innerHTML=W.laps.map((v,i)=>{const prev=W.laps[i+1]||0,sp=v-prev,cls=W.laps.length>2&&sp===best?' best':W.laps.length>2&&sp===worst?' worst':'';
 return `<div class="lap${cls}"><span>Runde ${W.laps.length-i}</span><span>+${fmtW(v-prev)}</span><span>${fmtW(v)}</span></div>`}).join('')}

/* ---------- Weltuhr ---------- */
const CITIES={'Europe/Berlin':'Berlin','Europe/London':'London','Europe/Istanbul':'Istanbul','Europe/Moscow':'Moskau','Africa/Cairo':'Kairo','Asia/Dubai':'Dubai','Asia/Kolkata':'Mumbai','Asia/Singapore':'Singapur','Asia/Tokyo':'Tokio','Australia/Sydney':'Sydney','Pacific/Auckland':'Auckland','America/New_York':'New York','America/Chicago':'Chicago','America/Los_Angeles':'Los Angeles','America/Sao_Paulo':'São Paulo'};
$('#wSel').innerHTML=Object.entries(CITIES).map(([z,n])=>`<option value="${z}">${n}</option>`).join('');
$('#wAdd').onclick=()=>{const z=$('#wSel').value;if(!S.cities.includes(z)){S.cities.push(z);save();drawWorld(true)}};
function parts(tz,d){const o={};new Intl.DateTimeFormat('en-GB',{timeZone:tz,hourCycle:'h23',year:'numeric',month:'numeric',day:'numeric',hour:'numeric',minute:'numeric',second:'numeric'}).formatToParts(d).forEach(p=>o[p.type]=+p.value);return o}
const asUtc=p=>Date.UTC(p.year,p.month-1,p.day,p.hour,p.minute,p.second);
function drawWorld(rebuild){const box=$('#wList'),now=new Date();
 if(rebuild){box.innerHTML='';S.cities.forEach(z=>{const d=document.createElement('div');d.className='card item';d.dataset.z=z;
  d.innerHTML='<div class="grow"><b></b><div></div></div><div class="tm"></div><button class="x" aria-label="Entfernen">✕</button>';
  d.querySelector('b').textContent=CITIES[z]||z;d.querySelector('.x').onclick=()=>{S.cities=S.cities.filter(c=>c!==z);save();drawWorld(true)};box.appendChild(d)})}
 const loc=asUtc(parts(Intl.DateTimeFormat().resolvedOptions().timeZone,now));
 $$('#wList .item').forEach(d=>{const p=parts(d.dataset.z,now),diff=(asUtc(p)-loc)/3600000,dd=Math.round((Date.UTC(p.year,p.month-1,p.day)-Date.UTC(...(l=>[l.getFullYear(),l.getMonth(),l.getDate()])(now)))/864e5);
  d.querySelector('.tm').textContent=p2(p.hour)+':'+p2(p.minute);
  d.querySelector('.grow div').textContent=(dd===0?'Heute':dd>0?'Morgen':'Gestern')+', '+(diff===0?'gleiche Zeit':(diff>0?'+':'')+diff+' Std zu dir')})}

/* ---------- Haupttakt ---------- */
function tick(){const n=new Date();
 $('#clock').innerHTML=p2(n.getHours())+':'+p2(n.getMinutes())+'<small>:'+p2(n.getSeconds())+'</small>';
 $('#today').textContent=n.toLocaleDateString('de-DE',{weekday:'long',day:'numeric',month:'long'});
 if(n.getSeconds()===0||!tick.d)checkAlarms(n);
 tick.d=1;tickTimer();if(!T.run)document.title='Uhr – Wecker, Timer, Stoppuhr, Weltuhr';
 if(n.getMilliseconds()<150||!tick.w){drawWorld(false);tick.w=1}}
drawAlarms();drawWorld(true);tick();setInterval(tick,100);
function swLoop(){if(W.run)$('#swDisp').textContent=fmtW(wNow());requestAnimationFrame(swLoop)}swLoop();
</script>
</body>
</html>
